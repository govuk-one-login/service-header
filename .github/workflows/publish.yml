name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for the OIDC flow in trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #pin@v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #pin@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build-all

      - name: Determine NPM Tag
        id: npm-tag
        # read the name of the tag being published – if it contains the string 'beta, publish a beta release'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}" 
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "Publishing beta"
            echo "git-tag=beta" >> $GITHUB_OUTPUT
          else
            echo "Publishing latest"
            echo "git-tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM
        run: npm publish --tag ${{ steps.npm-tag.outputs.git-tag }}
